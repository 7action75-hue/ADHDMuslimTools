<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A1312">
<title>FocusBridge 🌿</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='28' font-size='28'>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1413;--s1:#101D1B;--s2:#152523;--g:rgba(255,255,255,.03);
--b:rgba(255,255,255,.06);--m:#4ADE80;--go:#F5C842;--t:#2DD4BF;--p:#A78BFA;
--r:#FB7185;--o:#FB923C;--sk:#7DD3FC;--tx:#EDE8DF;--md:#8A9490;--dm:#4A5553;
--spr:cubic-bezier(.34,1.56,.64,1);--ez:cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,sans-serif;
display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative}
.sc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.sc::-webkit-scrollbar{display:none}
.ar{font-family:'Amiri',serif;direction:rtl;text-align:right}
.pg{padding:0 20px 100px}

/* Cards */
.c{background:var(--s1);border-radius:22px;padding:16px;border:1px solid var(--b);
position:relative;overflow:hidden;transition:transform .15s var(--ez)}
.c:active{transform:scale(.985)}
.c2{background:var(--s2)}

/* Nav */
.nv{position:absolute;bottom:0;left:0;right:0;height:68px;display:flex;
background:rgba(11,20,19,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(--b);padding:0 8px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;background:none;border:none;cursor:pointer;color:var(--dm);font-family:inherit;
transition:all .2s var(--spr);position:relative}
.nb.a{color:var(--m)}
.nb.a::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;
background:var(--m);border-radius:0 0 2px 2px}
.ni{font-size:20px;height:28px;display:flex;align-items:center;justify-content:center}
.nl{font-size:9px;font-weight:700;letter-spacing:.3px}

/* Typography */
h1{font-size:26px;font-weight:900;line-height:1.2}
h2{font-size:22px;font-weight:900;line-height:1.2;padding:16px 0 10px}
h3{font-size:15px;font-weight:800}
.sub{font-size:11px;color:var(--md);margin-top:2px}
.cap{font-size:9px;font-weight:800;color:var(--dm);letter-spacing:1.2px;text-transform:uppercase}
.tg{display:inline-flex;padding:4px 10px;border-radius:10px;font-size:9px;font-weight:800}

/* Animations */
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pi{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cf{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(-140px)rotate(720deg)scale(0);opacity:0}}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes gl{0%,100%{box-shadow:0 0 12px rgba(245,200,66,.1)}50%{box-shadow:0 0 24px rgba(245,200,66,.2)}}
@keyframes cp{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.afi{animation:fi .4s var(--ez) both}

/* Buttons */
.btn{padding:14px 24px;border-radius:16px;border:none;font-size:15px;font-weight:800;
font-family:inherit;cursor:pointer;transition:all .15s var(--ez);width:100%}
.btn:active{transform:scale(.97)}
.btn1{background:var(--m);color:#0A1312}
.btn2{background:linear-gradient(135deg,var(--m),var(--t));color:#0A1312}
.btn3{background:var(--s2);color:var(--tx);border:1px solid var(--b)}

/* Search */
.srch{width:100%;padding:12px 16px 12px 40px;border-radius:16px;background:var(--s1);
border:1px solid var(--b);color:var(--tx);font-size:14px;font-weight:600;
font-family:inherit;outline:none}
.srch:focus{border-color:rgba(74,222,128,.2)}
.srch::placeholder{color:var(--dm)}

/* Loot */
.lo{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.93);backdrop-filter:blur(24px);animation:fi .3s;cursor:pointer}
.lp{position:absolute;border-radius:50%;animation:cf 1.5s var(--spr) forwards;opacity:0}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:14px;background:var(--s1);border:1.5px solid var(--b);
color:var(--dm);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
font-family:inherit;transition:all .2s var(--ez);flex-shrink:0}
.tab.a{background:rgba(74,222,128,.1);border-color:var(--m);color:var(--m)}

/* Responsive */
@media(min-width:431px){body{background:#060A09}#app{border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}}
@media(max-width:370px){h1{font-size:22px}h2{font-size:19px}.pg{padding:0 16px 100px}}
</style>
</head>
<body>
<div id="app"></div>

// ════ FULL QURAN LIBRARY (50 key ayahs, categorized) ════
const AYAHS=[
// PATIENCE & HARDSHIP
{id:1,s:"Al-Baqarah",v:"2:153",ar:"يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ",en:"O believers, seek help through patience and prayer",cat:"patience",r:"common"},
{id:2,s:"Al-Baqarah",v:"2:286",ar:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",en:"Allah does not burden a soul beyond its capacity",cat:"patience",r:"common"},
{id:3,s:"Ash-Sharh",v:"94:5-6",ar:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا · إِنَّ مَعَ الْعُسْرِ يُسْرًا",en:"With hardship comes ease — indeed, with hardship comes ease",cat:"patience",r:"epic"},
{id:4,s:"Al-Baqarah",v:"2:216",ar:"وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ",en:"Perhaps you dislike something that is good for you",cat:"patience",r:"rare"},
{id:5,s:"Az-Zumar",v:"39:10",ar:"إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ",en:"The patient will be given reward without limit",cat:"patience",r:"epic"},
// TRUST IN ALLAH
{id:6,s:"Al-Baqarah",v:"2:186",ar:"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ",en:"When My servants ask about Me — I am near",cat:"tawakkul",r:"rare"},
{id:7,s:"At-Talaq",v:"65:3",ar:"وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ",en:"Whoever puts trust in Allah, He is enough for them",cat:"tawakkul",r:"rare"},
{id:8,s:"Al-Imran",v:"3:173",ar:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",en:"Sufficient for us is Allah, the best Disposer of affairs",cat:"tawakkul",r:"epic"},
{id:9,s:"Al-Anfal",v:"8:2",ar:"وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ",en:"And upon their Lord they rely",cat:"tawakkul",r:"common"},

{id:11,s:"Az-Zumar",v:"39:53",ar:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا",en:"Do not despair of Allah's mercy — He forgives all sins",cat:"mercy",r:"epic"},

{id:14,s:"Al-Hijr",v:"15:49",ar:"نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ",en:"Inform My servants that I am the Forgiving, the Merciful",cat:"mercy",r:"common"},

{id:15,s:"Ibrahim",v:"14:7",ar:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ",en:"If you are grateful, I will surely increase you",cat:"gratitude",r:"rare"},

// ════ HELPERS ════
const seed=(()=>{const d=new Date(),s=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);})();

function cP(lat=50.63,lng=5.57){const d=new Date(),n=Math.floor(d/86400000)+2440587.5-2451545,ec=-23.44*Math.cos((360/365*(d.getDate()+10))*Math.PI/180),dR=ec*Math.PI/180,lR=lat*Math.PI/180,eq=-7.655*Math.sin((357.528+.9856003*n)*Math.PI/180)+9.873*Math.sin(2*((280.46+.9856474*n)+1.914*Math.sin((357.528+.9856003*n)*Math.PI/180))*Math.PI/180),noon=12-lng/15-eq/60,ha=a=>Math.acos((Math.sin(a*Math.PI/180)-Math.sin(lR)*Math.sin(dR))/(Math.cos(lR)*Math.cos(dR)))*180/Math.PI/15,f=h=>{const hr=Math.floor(h),mn=Math.round((h-hr)*60);return`${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;};return{Fajr:f(noon-ha(-18)),Sunrise:f(noon-ha(-.833)),Dhuhr:f(noon+.02),Asr:f(noon+ha(45)*.67),Maghrib:f(noon+ha(-.833)),Isha:f(noon+ha(-17))};}
const PT=cP();
const tM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const nM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const fC=m=>{if(m<0)m+=1440;const h=Math.floor(m/60);return h>0?`${h}h ${m%60}m`:`${m%60}m`;};
function nP(){const n=nM(),o=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];for(const p of o){const m=tM(PT[p]);if(m>n)return{name:p,time:PT[p],mins:m-n};}return{name:"Fajr",time:PT.Fajr,mins:tM(PT.Fajr)+1440-n};}
function gQ(){const e=QS.filter(q=>q.df==='easy'),m=QS.filter(q=>q.df==='medium'),h=QS.filter(q=>q.df==='hard');return[e[seed%e.length],m[(seed*7)%m.length],h[(seed*13)%h.length],e[(seed*3+1)%e.length]];}
function gS(xp){let s=JN[0];for(const j of JN)if(xp>=j.xp)s=j;return s;}
function gN(xp){const s=gS(xp);const i=JN.indexOf(s);return i<JN.length-1?JN[i+1]:null;}

function ring(v,sz=44,sk=3,co=C.m){const r=(sz-sk)/2,ci=2*Math.PI*r,off=ci-Math.min(v/100,1)*ci;return`<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.03)" stroke-width="${sk}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${co}" stroke-width="${sk}" stroke-dasharray="${ci}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset .8s var(--spr);filter:drop-shadow(0 0 4px ${co}30)"/></svg>`;}

  let h=`<div class="pg">
    <h2>${k?"My Stats! 📊":"Insights"}</h2>
    <p class="sub" style="margin-bottom:14px">Your week at a glance.</p>
    
    <div class="c" style="margin-bottom:10px;text-align:center;background:linear-gradient(145deg,rgba(245,200,66,.06),rgba(74,222,128,.04));border-color:${C.go}12">
      <p class="cap">WEEKLY XP</p>
      <div style="font-size:42px;font-weight:900;color:${C.go};margin:4px 0">${tX}</div></div>
    
    <div class="c" style="margin-bottom:10px">
      <p class="cap" style="margin-bottom:8px">📊 DAILY XP</p>
      <div style="display:flex;gap:4px;align-items:flex-end;height:80px">${wl.map((d,i)=>{const pct=mX>0?(d.xp/mX)*100:0,isT=i===6;
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:8px;font-weight:700;color:${isT?C.go:'var(--dm)'}">${d.xp}</span>
          <div style="width:100%;border-radius:6px;background:${isT?`linear-gradient(180deg,${C.go},${C.m}60)`:C.m+'30'};height:${Math.max(pct,8)}%;transition:height .6s var(--spr) ${i*60}ms;min-height:4px"></div>
          <span style="font-size:8px;font-weight:${isT?800:600};color:${isT?C.go:'var(--dm)'}">${d.day}</span></div>`;}).join('')}</div></div>
    
    <div class="c" style="margin-bottom:10px">
      <p class="cap" style="margin-bottom:8px">🤲 PRAYERS THIS WEEK</p>
      <div style="display:flex;gap:4px;align-items:flex-end;height:60px">${wl.map((d,i)=>{const pct=(d.sl/5)*100,isT=i===6;
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:8px;font-weight:700;color:${d.sl>=5?C.go:'var(--dm)'}">${d.sl}/5</span>
          <div style="width:100%;border-radius:6px;background:${d.sl>=5?C.go+'60':C.t+'35'};height:${Math.max(pct,8)}%;transition:height .6s var(--spr) ${i*60}ms;min-height:4px"></div>
          <span style="font-size:8px;color:var(--dm)">${d.day}</span></div>`;}).join('')}</div>
      <div style="margin-top:8px;padding:8px 12px;border-radius:12px;background:${C.t}05;border:1px solid ${C.t}06">
        <p style="font-size:11px;color:${C.t};font-weight:700">💡 ${tS}/35 prayers this week. ${tS>=30?'ما شاء الله!':tS>=20?'Building momentum.':'Every prayer counts.'}</p></div></div>
    
    <div class="c" style="margin-bottom:10px">
      <p class="cap" style="margin-bottom:6px">🧠 BRAIN FUEL</p>
      <div style="display:flex;gap:4px">${wl.map((d,i)=>`<div style="flex:1;text-align:center"><div style="aspect-ratio:1;border-radius:10px;background:${d.fd>=4?C.m+'12':d.fd>=2?C.go+'10':C.r+'08'};border:1px solid ${d.fd>=4?C.m:d.fd>=2?C.go:C.r}10;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:${d.fd>=4?C.m:d.fd>=2?C.go:C.r}">${d.fd}/5</div><span style="font-size:7px;color:var(--dm)">${d.day}</span></div>`).join('')}</div></div>

    <div class="c" style="border-color:${C.go}10">
      <div style="display:flex;align-items:center;gap:12px"><span style="font-size:32px">${st.l}</span>
        <div style="flex:1"><div style="font-size:14px;font-weight:800;color:${C.go}">${st.n}</div><div style="font-size:11px;color:var(--dm)">${S.xp} XP · ${ns?`${ns.xp-S.xp} to ${ns.n}`:'Complete!'}</div></div></div>
      ${ns?`<div style="margin-top:8px;height:5px;border-radius:3px;background:rgba(255,255,255,.03);overflow:hidden"><div style="height:100%;border-radius:3px;background:linear-gradient(90deg,${C.go},${C.m});width:${Math.min(((S.xp-st.xp)/(ns.xp-st.xp))*100,100)}%"></div></div>`:''}
    </div>
    
    <div style="margin-top:16px;text-align:center"><button onclick="S.phase='onboard';S.obStep=0;R()" style="padding:8px 18px;border-radius:14px;background:var(--s1);border:1px solid var(--b);color:var(--dm);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">⚙️ Restart Onboarding</button></div>
  </div>`;return h;
}

// ════ LOOT ════
function sL(type,data){
  const o=document.createElement('div');o.className='lo';o.onclick=()=>o.remove();
  let ps='';const cols=[C.go,'#fff',C.m,C.t,C.p];
  for(let i=0;i<35;i++){ps+=`<div class="lp" style="left:${50+(Math.random()-.5)*80}%;top:${42+(Math.random()-.5)*60}%;width:${2+Math.random()*5}px;height:${2+Math.random()*5}px;background:${cols[i%5]};animation-delay:${Math.random()*400}ms"></div>`;}
  let c='';
  if(type==='ayah'){const rc=RC[data.r]||C.go;c=`<div style="font-size:14px;font-weight:800;color:${rc};letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${data.r==='legendary'?'⭐ LEGENDARY':data.r==='epic'?'💎 EPIC':'✨ '+data.r.toUpperCase()} VERSE</div><div style="background:rgba(255,255,255,.03);border-radius:22px;padding:22px;border:1px solid ${rc}18"><p class="ar" style="font-size:20px;color:${rc}bb;line-height:2;margin-bottom:8px">${data.ar}</p><p style="font-size:12px;color:var(--md);font-style:italic">"${data.en}"</p><p style="font-size:11px;color:${rc};font-weight:800;margin-top:8px">— ${data.s} ${data.v}</p></div>`;}
  else{c=`<div style="font-size:52px;margin-bottom:10px">${data.icon||'🌟'}</div><h3 style="font-size:22px;font-weight:900;color:${C.go};margin-bottom:6px">${data.title}</h3><p style="font-size:13px;color:var(--md)">${data.desc||''}</p><div style="margin-top:12px;padding:6px 18px;border-radius:14px;background:${C.m}12;display:inline-block"><span style="font-size:15px;font-weight:900;color:${C.m}">+${data.xp} XP</span></div>`;}
  o.innerHTML=`${ps}<div style="text-align:center;z-index:2;padding:30px;max-width:340px;animation:pi .5s ease .1s both">${c}</div>`;
  document.body.appendChild(o);setTimeout(()=>{if(document.body.contains(o))o.remove();},4500);
}

// ════ ACTIONS ════
function nav(s){S.screen=s;R();setTimeout(()=>{const e=document.getElementById('sc');if(e)e.scrollTop=0;},30);}
function sM(m){S.mode=m;S.obStep=1;R();}
function sS(s){S.struggle=s;S.obStep=2;R();}
function oN(){const i=document.getElementById('ni');if(i)S.name=i.value.trim();S.obStep=3;R();}
function go(){S.phase='app';S.screen='home';R();}
function dk(i){S.dhikr[i]++;if(S.dhikr[i]===DHIKR[i].n)S.xp+=5;R();}
function cS(p){S.salah[p]=S.salah[p]===0?1:S.salah[p]===1?.5:0;if(S.salah[p]===1)S.xp+=10;R();}
function colA(id){if(!S.col.includes(id)){S.col.push(id);S.xp+=5;R();const a=AYAHS.find(x=>x.id===id);if(a)setTimeout(()=>sL('ayah',a),300);}}

function dQ(id){
  if(S.qDone[id])return;const q=QS.find(x=>x.id===id);if(!q)return;
  S.qDone[id]=true;S.xp+=q.xp;
  const gw=S.garden.filter(s=>s.t&&s.g<3);
  if(gw.length)gw[Math.floor(Math.random()*gw.length)].g++;
  else{const em=S.garden.findIndex(s=>!s.t);if(em>=0){const ty=Object.keys(PL);S.garden[em]={t:ty[Math.floor(Math.random()*ty.length)],g:0};}}
  if(Math.random()<.25){const unc=AYAHS.filter(a=>!S.col.includes(a.id));if(unc.length){
    const wt=unc.map(a=>a.r==='legendary'?1:a.r==='epic'?3:a.r==='rare'?6:10),tw=wt.reduce((s,w)=>s+w,0);
    let r=Math.random()*tw,pk=unc[0];for(let i=0;i<unc.length;i++){r-=wt[i];if(r<=0){pk=unc[i];break;}}
    S.col.push(pk.id);R();setTimeout(()=>sL('ayah',pk),400);return;}}
  R();setTimeout(()=>sL('xp',{icon:q.i,title:S.mode==='kid'?'Done! 🎉':'Quest Complete!',desc:q.t,xp:q.xp}),300);
}

// ════ INIT ════
R();
setInterval(()=>{if(S.phase==='app'&&S.screen==='home')R();},30000);
</script>
